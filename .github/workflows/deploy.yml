name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a run that is already
# publishing is allowed to finish instead of leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Active LTS. Deliberately not the newest release line: this job gates the
          # deploy on lint and tests, so it should run on the version the toolchain is
          # actually exercised against, not one that shipped days ago.
          node-version: 24
          cache: npm

      - run: npm ci

      # Lint and tests gate the deploy: a red build must never reach the live site.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site via the API if it does not exist yet. Without this the
          # very first run fails with "Get Pages site failed / Not Found", because
          # configure-pages only *reads* the config and a brand-new repo has none —
          # you would have to flip the setting by hand before the first deploy could work.
          # Setting it here means a fresh clone or fork deploys with no manual step.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
